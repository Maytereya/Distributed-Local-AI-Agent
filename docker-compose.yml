version: "3.8"

services:
  bookworm-agent:
    build: .
    container_name: bookworm-agent
    ports:
      - "7860:7860"
    network_mode: bridge

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"    # HTTP
      - "443:443"  # HTTPS
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./letsencrypt:/etc/letsencrypt  # Сертификаты для HTTPS
    depends_on:
      - bookworm-agent
    network_mode: bridge

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./letsencrypt:/etc/letsencrypt  # Сертификаты храним тут
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - nginx
    command: certonly --webroot --webroot-path=/var/www/html --email your-email@example.com --agree-tos --no-eff-email -d ontheflyai.ru