services:
  bookworm-agent:
    build: .
    container_name: bookworm-agent
    restart: unless-stopped
    ports:
      - "7860:7860"
    volumes:
      - ./app_data:/app_data
      - ./messengers_router/data/topic_registry.yaml:/app/messengers_router/data/topic_registry.yaml
      - /var/run/docker.sock:/var/run/docker.sock
      # общий кэш Hugging Face
      - /opt/hf-cache:/root/.cache/huggingface
    environment:
      - FILTRATION_LOCAL_ONLY=1        # офлайн режим!
      - FILTRATION_DEVICE=auto
      - FILTRATION_CACHE=/root/.cache/huggingface
      - TOKENIZERS_PARALLELISM=false
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - local_net

  agent-api:
    build: .
    container_name: agent-api
    restart: unless-stopped
    expose:
      - "8010"
    volumes:
      - ./app_data:/app_data
      - ./messengers_router/data/topic_registry.yaml:/app/messengers_router/data/topic_registry.yaml
    environment:
      - AGENT_API_KEY=${AGENT_API_KEY:-}
      - TOKENIZERS_PARALLELISM=false
    command: [ "uvicorn", "agent_api:app", "--host", "0.0.0.0", "--port", "8010" ]
    networks:
      - local_net

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - BASE_URL=http://searxng:8080/
      - INSTANCE_NAME=bookworm-searxng
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8080/',timeout=3).status < 500 else 1)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - local_net

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /home/vl/bookworm_app/Distributed-Local-AI-Agent/nginx/html:/var/www/certbot/html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - bookworm-agent
      - agent-api
    networks:
      - local_net

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /home/vl/bookworm_app/Distributed-Local-AI-Agent/nginx/html:/var/www/certbot/html
    depends_on:
      - nginx
    command:
      - certonly
      - --webroot
      - -w
      - /var/www/certbot/html
      - --email=rakhmanov-v@ya.ru
      - --agree-tos
      - --no-eff-email
      - -d
      - ontheflyai.ru
    networks:
      - local_net

networks:
  local_net:
    external: true
