# ВНИМАНИЕ: ollama здесь НЕ описана — она живёт в docker-compose.ollama.yml,
# отдельным проектом. Это сделано намеренно: у неё другой жизненный цикл, и
# пересоздание стоит выгрузки и повторной загрузки 53 ГБ модели. Деплой бота
# не должен её трогать.
#
# При развёртывании С НУЛЯ её надо поднять отдельно:
#     docker compose -f docker-compose.ollama.yml up -d
# После перезагрузки сервера она поднимется сама (restart: always).
#
# НЕ запускайте здесь `--remove-orphans`: пока проекты разные, флаг удалит
# контейнер ollama.

services:
  bookworm-agent:
    build: .
    container_name: bookworm-agent
    restart: unless-stopped
    ports:
      - "7860:7860"
    volumes:
      - ./app_data:/app_data
      - ./messengers_router/data/topic_registry.yaml:/app/messengers_router/data/topic_registry.yaml
      - /var/run/docker.sock:/var/run/docker.sock
      # общий кэш Hugging Face
      - /opt/hf-cache:/root/.cache/huggingface
    environment:
      - FILTRATION_LOCAL_ONLY=1        # офлайн режим!
      - FILTRATION_DEVICE=auto
      - FILTRATION_CACHE=/root/.cache/huggingface
      - TOKENIZERS_PARALLELISM=false
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - local_net

  agent-api:
    build: .
    container_name: agent-api
    restart: unless-stopped
    expose:
      - "8010"
    volumes:
      - ./app_data:/app_data
      - ./messengers_router/data/topic_registry.yaml:/app/messengers_router/data/topic_registry.yaml
    environment:
      - AGENT_API_KEY=${AGENT_API_KEY:-}
      - TOKENIZERS_PARALLELISM=false
    command: [ "uvicorn", "agent_api:app", "--host", "0.0.0.0", "--port", "8010" ]
    networks:
      - local_net

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml
    environment:
      - BASE_URL=http://searxng:8080/
      - SEARXNG_BASE_URL=http://searxng:8080/
      - INSTANCE_NAME=bookworm-searxng
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
      - SEARXNG_SECRET=${SEARXNG_SECRET:-freetalkai-searxng-secret}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8080/',timeout=3).status < 500 else 1)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - local_net

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /home/vl/bookworm_app/Distributed-Local-AI-Agent/nginx/html:/var/www/certbot/html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - bookworm-agent
      - agent-api
    networks:
      - local_net

  chroma_container:
    image: chromadb/chroma@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    container_name: chroma_container
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - /home/vl/chroma-data:/data
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8000;
          printf 'GET /api/v2/heartbeat HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          grep -q '200 OK' <&3
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - local_net

  meili_server:
    image: getmeili/meilisearch:v1.19.1@sha256:abab6e9054572fea9fd409cf0f4fe3b65f6c8e70cd0f213004592b6d0e9587ac
    container_name: meili_server
    restart: always
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: development
      MEILI_HTTP_ADDR: 0.0.0.0:7700
      MEILI_SERVER_PROVIDER: docker
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set in .env}
    volumes:
      - /home/vl/meili_data_v1_19:/meili_data
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - --max-time
        - "3"
        - http://127.0.0.1:7700/health
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - local_net

networks:
  local_net:
    external: true
