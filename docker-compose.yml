version: "3.8"

services:
  bookworm-agent:
    build: .
    container_name: bookworm-agent
    ports:
      - "7860:7860"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # общий кэш Hugging Face
      - /opt/hf-cache:/root/.cache/huggingface
    environment:
      - FILTRATION_LOCAL_ONLY=1        # офлайн режим!
      - FILTRATION_DEVICE=auto
      - FILTRATION_CACHE=/root/.cache/huggingface
      - TOKENIZERS_PARALLELISM=false
    networks:
      - local_net

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /home/vl/bookworm_app/Distributed-Local-AI-Agent/nginx/html:/var/www/certbot/html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - bookworm-agent
    networks:
      - local_net

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /home/vl/bookworm_app/Distributed-Local-AI-Agent/nginx/html:/var/www/certbot/html
    depends_on:
      - nginx
    command:
      - certonly
      - --webroot
      - -w
      - /var/www/certbot/html
      - --email=rakhmanov-v@ya.ru
      - --agree-tos
      - --no-eff-email
      - -d
      - ontheflyai.ru
    networks:
      - local_net

networks:
  local_net:
    external: true
