version: "3.8"

services:
  bookworm-agent:
    build: .
    container_name: bookworm-agent
    ports:
      - "7860:7860"
    network_mode: bridge

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /home/vl/bookworm_app/Distributed-Local-AI-Agent/nginx/html:/var/www/certbot/html
    depends_on:
      - bookworm-agent
    network_mode: bridge

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /home/vl/bookworm_app/Distributed-Local-AI-Agent/nginx/html:/var/www/certbot/html
    depends_on:
      - nginx
    command:
      - certonly
      - --webroot
      - -w
      - /var/www/certbot/html
      - --email=rakhmanov-v@ya.ru
      - --agree-tos
      - --no-eff-email
      - --dry-run
      - -d
      - ontheflyai.ru
