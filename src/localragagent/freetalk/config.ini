[freetalk]
; Ключ режима в gradio_interface.py.
; Если mode_key не совпадает с названием переключателя в UI, режим FT не активируется.
mode_key = Free-talk-Ai

; Redis для оперативной памяти диалога (история + session meta).
; Используется в memory_redis.py.
redis_url = redis://redis:6379/0

; Префикс всех Redis-ключей FT: <redis_prefix>:<session_id>:...
; Нужен для изоляции FT от других компонентов.
redis_prefix = ft

; TTL сессии в Redis (секунды). По истечении история и meta очищаются.
session_ttl_sec = 86400

; Сколько последних реплик брать из Redis в рабочий контекст модели.
history_tail_turns = 14

; После какого числа реплик выполнять компактизацию (summary) и снимок в persistent memory.
compaction_trigger_turns = 22

; Сколько последних строк включать в fallback-summary, если LLM summary недоступен.
summary_keep_turns = 8

; Максимум tool-вызовов на один медицинский запрос.
max_tool_steps = 3

; Таймаут одного LLM-запроса (секунды).
llm_timeout_s = 40

; Таймаут ожидания очереди LLM (мс) до отказа.
llm_queue_timeout_ms = 30000

; Переключатель Meili-based инструментов:
; false -> FT использует только API/clinic catalog инструменты.
; true  -> добавляются main_index_info и news_info из legacy Services.
include_meili_tools = true

; Переключатель веб-поиска (SearXNG):
; false -> WebSearchPort не создается, tool web_search недоступен.
; true  -> доступен web_search tool для интернет-запросов.
enable_web_search_tool = true

; Базовый URL SearXNG внутри docker-сети.
web_search_url = http://searxng:8080

; Таймаут поискового HTTP-запроса к SearXNG (секунды).
web_search_timeout_s = 12

; Сколько результатов максимум возвращать из web_search tool.
web_search_max_results = 5

; Язык запроса в SearXNG (передается как параметр language).
web_search_language = ru-RU

; Таймаут healthcheck-пробы SearXNG (секунды).
web_search_healthcheck_timeout_s = 3

; TTL кэша статуса healthcheck SearXNG (секунды).
; Пока TTL не истек, FT не перепроверяет источник на каждый запрос.
web_search_healthcheck_ttl_s = 30

; Номинальная длина контекстного окна модели (должна соответствовать OLLAMA_CONTEXT_LENGTH).
context_window_tokens = 24576

; Порог предупреждения о заполнении контекста.
; 0.82 = предупреждать примерно при ~82% доступного бюджета.
context_warn_ratio = 0.82

; Эвристика char->token для грубой оценки длины prompt.
; Для русского обычно 3-5, здесь по умолчанию 4.
context_estimate_chars_per_token = 4

; Резерв токенов под ответ модели.
; Уменьшает риск переполнения окна на длинных ответах.
context_response_reserve_tokens = 2048

; Путь JSONL persistent-памяти (снимки summary после compaction/rollover).
persistent_memory_path = app_data/free_talk_memory/dialog_summaries.jsonl

; Системный промпт FT. Относительный путь считается от папки freetalk package.
system_prompt_path = system_prompt.txt
