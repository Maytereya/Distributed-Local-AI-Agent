# Вопрос об обслуживании по ДМС / ОМС (класс К26; `messengers_router/insurance_topic.py`, выключатель `insurance_topic`).
#
# Ответы — данные клиники, не кода: клиника одобрила 28.10 отвечать «так, как отвечают операторы» (ответ Алины через
# владельца, `docs/OWNER_DECISIONS.md`, запись 28.10 «ОМС и ДМС»). Меняет текст клиника — правится этот файл, код не меняется.

# Слова, по которым реплику показывают LLM: кандидат темы, не вердикт (принцип 2) — о чём реплика, решает выбор LLM.
# Сравнение — с началом слова реплики без учёта регистра и «ё». «По полису» в словаре клиники = ДМС (инструкция
# администраторов); «бесплатно» пациенты пишут об ОМС.
candidate_stems:
  - "дмс"
  - "омс"
  - "полис"
  - "страхов"
  - "гарантийн"
  - "бесплатн"

# Как получить помощь по ДМС — ответ операторов (одобрен клиникой 28.10). Признака ДМС у врачей в данных МИС бота нет,
# поэтому про конкретного врача — только оператор (`handoff.dms_doctor`).
dms_memo: |-
  По ДМС:
  — по прямому доступу — приём врачей без учёной степени;
  — на УЗИ, анализы и манипуляции нужно гарантийное письмо; анализы при наличии гарантийного письма сдаются без записи;
  — с собой — паспорт, прийти лучше за 15 минут.

# После памятки: записать по ДМС и уточнить условия полиса может только сотрудник клиники.
dms_offer: "Записаться по ДМС поможет оператор. Перевести на оператора?"

# Перевод на оператора (решение владельца 28.10): ОМС — много нюансов, оператор передаёт оперменеджеру; ведёт ли приём по
# ДМС конкретный врач — в данных МИС бота нет; гарантийное письмо, отдел ДМС, согласование, уже оформленная запись — дело
# сотрудника клиники.
handoff:
  oms: "Вопросы по ОМС подскажет оператор — соединяю."
  dms_doctor: "Ведёт ли врач приём по ДМС, подскажет оператор — соединяю."
  dms_case: "С этим вопросом по ДМС поможет оператор — соединяю."
