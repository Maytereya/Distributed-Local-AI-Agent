    title: "Подготовка к ФГДС/гастроскопии"
    enabled: true
    priority: 260
    label: "PREPARE"
    marks:
      domain: "knowledge"
      subtype: "prepare_procedure"
    match:
      any_keywords: ["фгдс", "гастроскоп", "эзофагогастродуоденоскоп"]
      all_keywords: []
      regex: []
      exclude_keywords: []
    route:
      strategy: "meili_first"
      sources:
        - kind: "meili"
          index: "main_index"
    context:
      interrupts_active_appointment: true
      require_cancel_confirm_if_appointment_active: true
    fallback:
      action: "handoff"
      reason: "knowledge_not_found"
      message_key: "knowledge_not_found_operator"

