name: Lint & Hermetic Tests

# Ловит регрессии NLU-правил/политик на каждом пуше (включая пуши без локального
# гейта). Гоняет герметичное подмножество: без сети, без локальных кэшей каталога
# (agent_logic_2/nayka_api/apidata/*.jsonl не в git), без config.ini (agent_logic_2/config.py
# default-safe). Список файлов — tests/hermetic_files.txt (18.10: 173 файла, ~3850 тестов;
# проверено копией CI — Python 3.12 + requirements-ci.txt, без конфига и срезов).
# ПОЛНЫЙ suite (~2840 тестов, требует кэшей) остаётся локальным гейтом перед коммитом:
# ./venv/bin/python -m pytest -q -p no:cacheprovider
# Расширение списка: добавляй файл, только если он зелёный без сети/кэшей/конфига;
# список только растёт (tests/test_hermetic_files_ratchet.py).

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  lint-and-hermetic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # как на проде (3.12.3), решение 08.10
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI deps (минимальный набор, не полный requirements.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          # Пакеты репо (messengers_router и др.) должны импортироваться из тестов:
          # editable-установка по pyproject; --no-deps — зависимости уже стоят выше.
          pip install -e . --no-deps

      - name: Ruff (messengers_router + tests)
        run: ruff check messengers_router tests

      - name: Hermetic tests (no network / no caches / no config.ini)
        run: pytest -q -p no:cacheprovider $(cat tests/hermetic_files.txt)
