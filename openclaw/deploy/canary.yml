services:
  canary:
    image: ghcr.io/openclaw/openclaw:2026.9.9@sha256:7f10d5cc975a90b65192eaa099454fe33ce8ce2390806c61c65cd868e9ef730d
    container_name: openclaw-reporting-canary
    user: "1000:1000"
    entrypoint: [node, openclaw.mjs]
    command: [gateway, --bind, lan, --port, "18791"]
    volumes:
      - /home/vl/.reporting-canary/state:/home/node/.openclaw
      - /home/vl/.reporting-deploy/security-r2/extensions:/extensions:ro
      - /home/vl/.reporting-secrets/monitor_api_token:/run/secrets/monitor_api_token:ro
      - /home/vl/.reporting-secrets/sandbox_identity:/run/secrets/sandbox_identity:ro
      - /home/vl/.reporting-secrets/sandbox_known_hosts:/run/secrets/sandbox_known_hosts:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    ports: ["127.0.0.1:18791:18791"]
    networks: [local_net, sandbox_private]
  sandbox:
    image: local/openclaw-ssh-sandbox:security-r1
    container_name: openclaw-ssh-sandbox-canary
    hostname: openclaw-sandbox
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /srv/workspaces:size=256m,uid=1000,gid=1000,mode=700
    volumes:
      - /home/vl/.reporting-secrets/sandbox_host_key:/keys/ssh_host_ed25519_key:ro
      - /home/vl/.reporting-secrets/sandbox_identity.pub:/keys/authorized_keys:ro
    networks:
      sandbox_private:
        aliases: [openclaw-sandbox]
networks:
  local_net:
    external: true
  sandbox_private:
    internal: true
