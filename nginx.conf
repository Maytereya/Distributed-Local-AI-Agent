worker_processes 1;

events {
    worker_connections 1024;
}

http {
    charset utf-8;
    default_type text/html;

    map $http_user_agent $is_preview_bot {
        default 0;
        ~*telegrambot 1;
        ~*whatsapp 1;
        ~*facebookexternalhit 1;
    }

    server {
        listen 80 default_server;
        server_name ontheflyai.ru;
        
        location /.well-known/acme-challenge/ {
            alias /var/www/certbot/html/.well-known/acme-challenge/;
            add_header X-Test-Location "ACME challenge";
            allow all;
        }

        location / {
            if ($is_preview_bot) {
                return 200 "<!doctype html>\n"
                           "<html>\n"
                           "<head>\n"
                           "<meta charset='utf-8'>\n"
                           "<title>Neiry.ai</title>\n"
                           "<meta property='og:type' content='website'>\n"
                           "<meta property='og:title' content='Neiry.ai'>\n"
                           "<meta property='og:description' content='Neiry.ai — чат‑бот для ваших данных. Нажмите, чтобы открыть.'>\n"
                           "<meta property='og:url' content='https://ontheflyai.ru/'>\n"
                           "<meta property='og:site_name' content='Neiry.ai'>\n"
                           "<meta property='og:image' content='https://ontheflyai.ru/gradio_api/file=static/logo_nauka.png?v=2'>\n"
                           "<meta property='og:image:secure_url' content='https://ontheflyai.ru/gradio_api/file=static/logo_nauka.png?v=2'>\n"
                           "<meta property='og:image:type' content='image/png'>\n"
                           "<meta property='og:image:width' content='1200'>\n"
                           "<meta property='og:image:height' content='630'>\n"
                           "<meta property='og:locale' content='ru_RU'>\n"
                           "</head>\n"
                           "<body></body>\n"
                           "</html>\n";
            }
            proxy_pass http://bookworm-agent:7860;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl default_server;
        server_name ontheflyai.ru;

        ssl_certificate /etc/letsencrypt/live/ontheflyai.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ontheflyai.ru/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location /.well-known/acme-challenge/ {
            alias /var/www/certbot/html/.well-known/acme-challenge/;
            add_header X-Test-Location "ACME challenge";
            allow all;
        }

        location / {
            if ($is_preview_bot) {
                return 200 "<!doctype html>\n"
                           "<html>\n"
                           "<head>\n"
                           "<meta charset='utf-8'>\n"
                           "<title>Neiry.ai</title>\n"
                           "<meta property='og:type' content='website'>\n"
                           "<meta property='og:title' content='Neiry.ai'>\n"
                           "<meta property='og:description' content='Neiry.ai — чат‑бот для ваших данных. Нажмите, чтобы открыть.'>\n"
                           "<meta property='og:url' content='https://ontheflyai.ru/'>\n"
                           "<meta property='og:site_name' content='Neiry.ai'>\n"
                           "<meta property='og:image' content='https://ontheflyai.ru/gradio_api/file=static/logo_nauka.png?v=2'>\n"
                           "<meta property='og:image:secure_url' content='https://ontheflyai.ru/gradio_api/file=static/logo_nauka.png?v=2'>\n"
                           "<meta property='og:image:type' content='image/png'>\n"
                           "<meta property='og:image:width' content='1200'>\n"
                           "<meta property='og:image:height' content='630'>\n"
                           "<meta property='og:locale' content='ru_RU'>\n"
                           "</head>\n"
                           "<body></body>\n"
                           "</html>\n";
            }
            proxy_pass http://bookworm-agent:7860;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
