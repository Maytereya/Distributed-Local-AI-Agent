worker_processes  1;

events { worker_connections 1024; }

http {
    ## базовые опции
    include       /etc/nginx/mime.types;    # корректные Content-Type (image/png и т.п.)
    default_type  application/octet-stream; # безопасный дефолт
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    charset                utf-8;
    client_max_body_size   100m;

    ## детектор превью-ботов
    map $http_user_agent $is_preview_bot {
        default                 0;
        ~*telegrambot           1;
        ~*whatsapp              1;
        ~*facebookexternalhit   1;
        ~*twitterbot            1;
    }

    ## если бот — будем искать этот файл
    map $is_preview_bot $preview_uri {
        1   /preview/index.html;
        0   "";
    }

    ## для websocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    ## upstream до gradio
    upstream gradio_app {
        server bookworm-agent:7860;
        keepalive 32;
    }
    ## upstream до faster whisper
    upstream whisper_api {
    server whisper-gpu:8000;
    keepalive 32;
    }

    ## upstream до API-endpoint
    upstream agent_api {
    server agent-api:8010;
    keepalive 32;
    }

    #####################################################################
    ## HTTP :80
    #####################################################################
    server {
        listen      80 default_server;
        server_name ontheflyai.ru;

        ## очень важно: здесь лежат preview/ и .well-known/
        root /var/www/certbot/html;

        ## ACME challenge
        location /.well-known/acme-challenge/ {
            try_files $uri =404;
            add_header X-Test-Location "ACME challenge";
            allow all;
        }

        ## раздача файлов превью (картинка og.png и index.html)
        location /preview/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=86400";
        }

        ## главная: ботам отдать preview/index.html, остальным — Gradio
        location / {
            # отладочные заголовки — удобно для curl-проверок
            add_header X-Preview-Bot $is_preview_bot always;
            add_header X-Preview-Uri $preview_uri always;

            try_files $preview_uri @gradio;
        }

        location = /whoami {
        default_type text/plain;
        return 200 "remote_addr=$remote_addr\n";
        }

        # Messengers endpoint (SSE/jsonl)
        location = ^~ /api/ {
            allow 172.16.4.0/24;
            allow 192.168.0.35;
            allow 192.168.0.0/22;
            deny all;

            proxy_pass         http://agent_api;
            proxy_http_version 1.1;

            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;

            # SSE/stream критично
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            send_timeout       86400;

            add_header X-Accel-Buffering no;
        }

        location ^~ /v1/agent/ {
            allow 172.16.4.0/24;
            allow 192.168.0.35;
            allow 192.168.0.0/22;
            deny all;
            proxy_pass         http://agent_api;
            proxy_http_version 1.1;

            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;

            # критично для SSE
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            send_timeout       86400;

            add_header X-Accel-Buffering no;
        }

        location ^~ /docs {
            allow 172.16.4.0/24;
            allow 192.168.0.35;
            allow 192.168.0.0/22;
            deny all;
            proxy_pass http://agent_api;
        }

        location ^~ /redoc {
            allow 172.16.4.0/24;
            allow 192.168.0.35;
            allow 192.168.0.0/22;
            deny all;
            proxy_pass http://agent_api;
        }

        location ^~ /openapi.json {
            allow 172.16.4.0/24;
            allow 192.168.0.35;
            allow 192.168.0.0/22;
            deny all;
            proxy_pass http://agent_api;
        }

        location @gradio {
            proxy_pass         http://gradio_app;
            proxy_http_version 1.1;

            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;

            # WebSocket
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;

            # SSE/stream
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            send_timeout       86400;

            add_header X-Accel-Buffering no;
        }
        location ^~ /whisper/ {
            allow 172.16.4.0/24;
            allow 192.168.0.35;
            allow 192.168.0.0/22;
            deny all;

            proxy_pass         http://whisper_api/;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # когда будем использовать WS /whisper/stream
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;

            proxy_buffering    off;
            proxy_cache        off;

            add_header X-Accel-Buffering no;
        }
    }

    #####################################################################
    ## HTTPS :443
    #####################################################################
    server {
        listen      443 ssl http2 default_server;
        server_name ontheflyai.ru;

        ssl_certificate     /etc/letsencrypt/live/ontheflyai.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ontheflyai.ru/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        ## тот же корень со статикой
        root /var/www/certbot/html;

        location /.well-known/acme-challenge/ {
            try_files $uri =404;
            add_header X-Test-Location "ACME challenge";
            allow all;
        }

        location /preview/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=86400";
        }

        location / {
            add_header X-Preview-Bot $is_preview_bot always;
            add_header X-Preview-Uri $preview_uri always;

            try_files $preview_uri @gradio_ssl;
        }

        # Messengers endpoint (SSE/jsonl)
        location = ^~ /api/ {
            allow 172.16.4.0/24;
            allow 192.168.0.35;
            allow 192.168.0.0/22;
            deny all;

            proxy_pass         http://agent_api;
            proxy_http_version 1.1;

            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;

            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            send_timeout       86400;

            add_header X-Accel-Buffering no;
        }

        location ^~ /v1/agent/ {
            allow 172.16.4.0/24;
            allow 192.168.0.35;
            allow 192.168.0.0/22;
            deny all;

            proxy_pass         http://agent_api;
            proxy_http_version 1.1;

            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;

            # критично для SSE
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            send_timeout       86400;

            add_header X-Accel-Buffering no;
        }

                location ^~ /docs {
            allow 172.16.4.0/24;
            allow 192.168.0.35;
            allow 192.168.0.0/22;
            deny all;
            proxy_pass http://agent_api;
        }

        location ^~ /redoc {
            allow 172.16.4.0/24;
            allow 192.168.0.35;
            allow 192.168.0.0/22;
            deny all;
            proxy_pass http://agent_api;
        }

        location ^~ /openapi.json {
            allow 172.16.4.0/24;
            allow 192.168.0.35;
            allow 192.168.0.0/22;
            deny all;
            proxy_pass http://agent_api;
        }

        location @gradio_ssl {
            proxy_pass         http://gradio_app;
            proxy_http_version 1.1;

            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;

            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;

            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            send_timeout       86400;

            add_header X-Accel-Buffering no;
        }
    }
}