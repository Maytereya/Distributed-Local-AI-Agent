worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server {
        listen 80 default_server;
        server_name ontheflyai.ru;
        
        location /.well-known/acme-challenge/ {
            alias /var/www/certbot/html/.well-known/acme-challenge/;
            add_header X-Test-Location "ACME challenge";
            allow all;
        }

        location / {
            proxy_pass http://172.17.0.6:7860;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl default_server;
        server_name ontheflyai.ru;

        ssl_certificate /etc/letsencrypt/live/ontheflyai.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ontheflyai.ru/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location /.well-known/acme-challenge/ {
            alias /var/www/certbot/html/.well-known/acme-challenge/;
            add_header X-Test-Location "ACME challenge";
            allow all;
        }

        location / {
            proxy_pass http://172.17.0.6:7860;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
