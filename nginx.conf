worker_processes  1;

events { worker_connections 1024; }

http {
    # полезно, чтобы не резать ответ
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # на всякий
    client_max_body_size 100m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server;
        server_name ontheflyai.ru;

        location /.well-known/acme-challenge/ {
            alias /var/www/certbot/html/.well-known/acme-challenge/;
            add_header X-Test-Location "ACME challenge";
            allow all;
        }

        location / {
            proxy_pass         http://bookworm-agent:7860;
            proxy_http_version 1.1;

            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # WebSocket
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;

            # SSE/стрим: не буферизуем, длинные таймауты
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout  86400;
            proxy_send_timeout  86400;
            send_timeout        86400;

            # иногда нужно принудительно
            add_header X-Accel-Buffering no;
        }
    }

    server {
        listen 443 ssl http2 default_server;
        server_name ontheflyai.ru;

        ssl_certificate     /etc/letsencrypt/live/ontheflyai.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ontheflyai.ru/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location /.well-known/acme-challenge/ {
            alias /var/www/certbot/html/.well-known/acme-challenge/;
            add_header X-Test-Location "ACME challenge";
            allow all;
        }

        location / {
            proxy_pass         http://bookworm-agent:7860;
            proxy_http_version 1.1;

            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;

            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout  86400;
            proxy_send_timeout  86400;
            send_timeout        86400;

            add_header X-Accel-Buffering no;
        }
    }
}