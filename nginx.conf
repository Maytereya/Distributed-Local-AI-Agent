worker_processes  1;

events { worker_connections 1024; }

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    charset utf-8;
    default_type text/html;
    client_max_body_size 100m;

    # 1) Определяем ботов прехедера
    map $http_user_agent $is_preview_bot {
        default 0;
        ~*telegrambot 1;
        ~*whatsapp 1;
        ~*facebookexternalhit 1;
        ~*twitterbot 1;   # на будущее
    }

    # 2) Если бот — подсовываем готовую статическую страницу
    map $is_preview_bot $preview_uri {
        1 /preview/index.html;
        0 "";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream gradio_app { server bookworm-agent:7860; }

    server {
        listen 80 default_server;
        server_name ontheflyai.ru;

        # отдаём статику для preview и ACME
        location /.well-known/acme-challenge/ {
            alias /var/www/certbot/html/.well-known/acme-challenge/;
            add_header X-Test-Location "ACME challenge";
            allow all;
        }

        location /preview/ {
            alias /var/www/certbot/html/preview/;
            add_header Cache-Control "public, max-age=86400";
        }

        # если $preview_uri существует — отдать его; иначе — в Gradio
        location / {
            try_files $preview_uri @gradio;
        }

        location @gradio {
            proxy_pass         http://gradio_app;
            proxy_http_version 1.1;

            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;

            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout  86400;
            proxy_send_timeout  86400;
            send_timeout        86400;

            add_header X-Accel-Buffering no;
        }
    }

    server {
        listen 443 ssl http2 default_server;
        server_name ontheflyai.ru;

        ssl_certificate     /etc/letsencrypt/live/ontheflyai.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ontheflyai.ru/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location /.well-known/acme-challenge/ {
            alias /var/www/certbot/html/.well-known/acme-challenge/;
            add_header X-Test-Location "ACME challenge";
            allow all;
        }

        location /preview/ {
            alias /var/www/certbot/html/preview/;
            add_header Cache-Control "public, max-age=86400";
        }

        location / {
            try_files $preview_uri @gradio_ssl;
        }

        location @gradio_ssl {
            proxy_pass         http://gradio_app;
            proxy_http_version 1.1;

            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;

            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout  86400;
            proxy_send_timeout  86400;
            send_timeout        86400;

            add_header X-Accel-Buffering no;
        }
    }
}