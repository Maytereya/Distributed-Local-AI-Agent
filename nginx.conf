worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name ontheflyai.ru;
        return 301 https://$host$request_uri;  # Перенаправляем все HTTP-запросы на HTTPS
    }

    server {
        listen 443 ssl;
        server_name ontheflyai.ru;

        ssl_certificate /etc/letsencrypt/live/ontheflyai.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ontheflyai.ru/privkey.pem;

        location / {
            proxy_pass http://172.17.0.6:7860;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}